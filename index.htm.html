<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordle</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #121213;
    color: #fff;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  header {
    width: 100%;
    max-width: 500px;
    border-bottom: 1px solid #3a3a3c;
    padding: 12px 0;
    text-align: center;
    position: relative;
  }

  header h1 { font-size: 2rem; font-weight: 700; letter-spacing: 4px; }

  #stats-bar {
    font-size: 0.75rem;
    color: #818384;
    margin-top: 4px;
    letter-spacing: 1px;
  }

  #message {
    height: 28px;
    margin: 10px 0 4px;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 1px;
    color: #fff;
    text-align: center;
  }

  #board {
    display: grid;
    grid-template-rows: repeat(6, 1fr);
    gap: 5px;
    width: 310px;
    height: 372px;
  }

  .row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
  }

  .tile {
    border: 2px solid #3a3a3c;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    font-weight: 700;
    text-transform: uppercase;
    color: #fff;
    transition: border-color 0.05s;
    user-select: none;
  }

  .tile.filled { border-color: #565758; animation: pop 0.1s ease; }
  .tile.correct { background: #538d4e; border-color: #538d4e; }
  .tile.present { background: #b59f3b; border-color: #b59f3b; }
  .tile.absent  { background: #3a3a3c; border-color: #3a3a3c; }
  .tile.revealed { animation: flip 0.5s ease forwards; }

  @keyframes pop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  @keyframes flip {
    0%   { transform: rotateX(0); }
    50%  { transform: rotateX(-90deg); }
    100% { transform: rotateX(0); }
  }

  .tile.shake { animation: shake 0.5s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%     { transform: translateX(-6px); }
    40%     { transform: translateX(6px); }
    60%     { transform: translateX(-4px); }
    80%     { transform: translateX(4px); }
  }

  #keyboard {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
  }

  .kb-row { display: flex; gap: 6px; }

  .key {
    height: 58px;
    min-width: 43px;
    border-radius: 4px;
    background: #818384;
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    cursor: pointer;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    user-select: none;
  }

  .key.wide { min-width: 65px; font-size: 0.7rem; }
  .key:active { opacity: 0.8; }
  .key.correct { background: #538d4e; }
  .key.present { background: #b59f3b; }
  .key.absent  { background: #3a3a3c; }

  #play-again {
    margin-top: 20px;
    padding: 12px 32px;
    background: #538d4e;
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 2px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    display: none;
  }

  #play-again:hover { background: #6aaf5e; }
</style>
</head>
<body>

<header>
  <h1>WORDLE</h1>
  <div id="stats-bar">Streak: <span id="streak">0</span> &nbsp;|&nbsp; Wins: <span id="wins">0</span> &nbsp;|&nbsp; Games: <span id="games">0</span></div>
</header>

<div id="message"></div>

<div id="board"></div>

<div id="keyboard">
  <div class="kb-row" id="kb-row-1"></div>
  <div class="kb-row" id="kb-row-2"></div>
  <div class="kb-row" id="kb-row-3"></div>
</div>

<button id="play-again">PLAY AGAIN</button>

  "wrong","yacht","yearn","yield","young","youth","zebra","zesty","zippy"

const KEYBOARD_ROWS = [
  ['q','w','e','r','t','y','u','i','o','p'],
  ['a','s','d','f','g','h','j','k','l'],
  ['Enter','z','x','c','v','b','n','m','⌫']
];

let answer, currentRow, currentCol, gameOver, tileGrid, keyMap;
let stats = JSON.parse(localStorage.getItem('wordle-stats') || '{"streak":0,"wins":0,"games":0}');

function init() {
  answer = WORDS[Math.floor(Math.random() * WORDS.length)].toUpperCase();
  currentRow = 0; currentCol = 0; gameOver = false;
  tileGrid = []; keyMap = {};

  document.getElementById('board').innerHTML = '';
  for (let r = 0; r < 6; r++) {
    const row = document.createElement('div');
    row.className = 'row';
    tileGrid[r] = [];
    for (let c = 0; c < 5; c++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      row.appendChild(tile);
      tileGrid[r][c] = tile;
    }
    document.getElementById('board').appendChild(row);
  }

  ['kb-row-1','kb-row-2','kb-row-3'].forEach((id, i) => {
    const row = document.getElementById(id);
    row.innerHTML = '';
    KEYBOARD_ROWS[i].forEach(k => {
      const btn = document.createElement('button');
      btn.className = 'key' + (k === 'Enter' || k === '⌫' ? ' wide' : '');
      btn.textContent = k;
      btn.dataset.key = k;
      btn.addEventListener('click', () => handleKey(k));
      row.appendChild(btn);
      if (k !== 'Enter' && k !== '⌫') keyMap[k] = btn;
    });
  });

  document.getElementById('play-again').style.display = 'none';
  setMessage('');
  updateStats();
}

function setMessage(msg, duration) {
  document.getElementById('message').textContent = msg;
  if (duration) setTimeout(() => document.getElementById('message').textContent = '', duration);
}

function updateStats() {
  document.getElementById('streak').textContent = stats.streak;
  document.getElementById('wins').textContent = stats.wins;
  document.getElementById('games').textContent = stats.games;
}

function handleKey(key) {
  if (gameOver) return;
  if (key === '⌫' || key === 'Backspace') {
    if (currentCol > 0) {
      currentCol--;
      tileGrid[currentRow][currentCol].textContent = '';
      tileGrid[currentRow][currentCol].className = 'tile';
    }
  } else if (key === 'Enter') {
    submitGuess();
  } else if (/^[a-zA-Z]$/.test(key) && currentCol < 5) {
    tileGrid[currentRow][currentCol].textContent = key.toUpperCase();
    tileGrid[currentRow][currentCol].className = 'tile filled';
    currentCol++;
  }
}

function submitGuess() {
  if (currentCol < 5) {
    shakeRow(currentRow);
    setMessage('Not enough letters', 1500);
    return;
  }
  const guess = Array.from({length:5}, (_,i) => tileGrid[currentRow][i].textContent).join('');
  if (!WORDS.includes(guess.toLowerCase())) {
    shakeRow(currentRow);
    setMessage('Not in word list', 1500);
    return;
  }

  const result = score(guess, answer);
  revealRow(currentRow, result, guess, () => {
    updateKeyboard(guess, result);
    if (result.every(r => r === 'correct')) {
      const msgs = ['Genius!','Magnificent!','Impressive!','Splendid!','Great!','Phew!'];
      setMessage(msgs[currentRow] || 'Nice!');
      stats.wins++; stats.streak++; stats.games++;
      localStorage.setItem('wordle-stats', JSON.stringify(stats));
      updateStats();
      gameOver = true;
      setTimeout(() => document.getElementById('play-again').style.display = 'inline-block', 1200);
    } else {
      currentRow++;
      currentCol = 0;
      if (currentRow === 6) {
        setMessage(answer);
        stats.streak = 0; stats.games++;
        localStorage.setItem('wordle-stats', JSON.stringify(stats));
        updateStats();
        gameOver = true;
        setTimeout(() => document.getElementById('play-again').style.display = 'inline-block', 800);
      }
    }
  });
}

function score(guess, answer) {
  const result = Array(5).fill('absent');
  const ansArr = answer.split('');
  const used = Array(5).fill(false);
  // greens
  for (let i = 0; i < 5; i++) {
    if (guess[i] === answer[i]) { result[i] = 'correct'; used[i] = true; }
  }
  // yellows
  for (let i = 0; i < 5; i++) {
    if (result[i] === 'correct') continue;
    for (let j = 0; j < 5; j++) {
      if (!used[j] && guess[i] === ansArr[j]) {
        result[i] = 'present'; used[j] = true; break;
      }
    }
  }
  return result;
}

function revealRow(row, result, guess, done) {
  for (let i = 0; i < 5; i++) {
    const tile = tileGrid[row][i];
    const delay = i * 300;
    setTimeout(() => {
      tile.classList.add('revealed');
      setTimeout(() => {
        tile.className = 'tile ' + result[i];
      }, 250);
    }, delay);
  }
  setTimeout(done, 5 * 300 + 100);
}

function updateKeyboard(guess, result) {
  const priority = { correct: 3, present: 2, absent: 1 };
  for (let i = 0; i < 5; i++) {
    const k = guess[i].toLowerCase();
    const btn = keyMap[k];
    if (!btn) continue;
    const cur = btn.className.match(/correct|present|absent/)?.[0];
    if (!cur || priority[result[i]] > priority[cur]) {
      btn.className = 'key ' + result[i];
    }
  }
}

function shakeRow(row) {
  tileGrid[row].forEach(t => {
    t.classList.add('shake');
    t.addEventListener('animationend', () => t.classList.remove('shake'), {once:true});
  });
}

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  handleKey(e.key === 'Backspace' ? 'Backspace' : e.key);
});

document.getElementById('play-again').addEventListener('click', init);

init();
</script>
